# Full build on pull requests into release: every package, and the
# netinstall ISO alongside (it needs no packages). Releases ship only the
# netinstall ISO; the full offline ISO is still built locally (make iso).
# workflow_dispatch runs it on any branch, for testing the build itself.
name: build

on:
  pull_request:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # The runner image ships ~30 GB of SDKs this build never uses; the
      # Flutter and KDE build dependencies need the room.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null
          df -h /

      - uses: actions/checkout@v4
        with:
          path: couchbox

      - uses: actions/checkout@v4
        with:
          repository: jpsutton/fire-blaster
          path: fire-blaster

      - name: Build packages (archlinux container)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/couchbox:/src" \
            -v "$GITHUB_WORKSPACE/fire-blaster:/fire-blaster" \
            -e FIRE_BLASTER_SRC=/fire-blaster \
            -w /src archlinux:base-devel scripts/ci/build-packages.sh

      - name: Disk after build
        if: always()
        run: df -h /

      - uses: actions/upload-artifact@v4
        with:
          name: couchbox-repo
          path: couchbox/out/repo/
          if-no-files-found: error
          retention-days: 14

  # The netinstall ISO downloads its target at install time, so it doesn't
  # wait for the packages job. (The job is "iso", the check release requires.)
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build netinstall ISO (archlinux container)
        run: |
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src archlinux:base-devel scripts/ci/build-iso.sh net

      - name: ISO size
        run: |
          ls -la out/*.iso
          size=$(stat -c %s out/*.iso)
          echo "Netinstall ISO: $((size / 1048576)) MiB" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: couchbox-netinstall-iso
          path: out/*.iso
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
