# Raspberry Pi: the aarch64 couchbox repo and a flashable test image, built
# natively on an arm64 runner inside an Arch Linux ARM container. Runs on
# pushes to Raspberry Pi branches, and by hand on any branch.
name: rpi

on:
  push:
    branches: ['feat/rpi-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rpi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null
          df -h /

      - uses: actions/checkout@v4
        with:
          path: couchbox

      - uses: actions/checkout@v4
        with:
          repository: jpsutton/fire-blaster
          path: fire-blaster

      # The generic aarch64 rootfs, checked against the Arch Linux ARM build
      # key before it becomes the build container.
      - name: Arch Linux ARM container
        run: |
          base=http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz
          curl -fsSL -o alarm.tar.gz "$base"
          curl -fsSL -o alarm.tar.gz.sig "$base.sig"
          gpg --batch --keyserver hkps://keyserver.ubuntu.com --recv-keys 68B3537F39A313B3E574D06777193F152BDBE6A6
          gpg --batch --verify alarm.tar.gz.sig alarm.tar.gz
          sudo docker import alarm.tar.gz alarm:build
          rm alarm.tar.gz alarm.tar.gz.sig

      # Privileged with the host's /dev: the image builder loop-mounts its
      # filesystems and arch-chroots into them.
      - name: Build packages and image
        run: |
          sudo docker run --rm --privileged -v /dev:/dev \
            -v "$GITHUB_WORKSPACE/couchbox:/src" \
            -v "$GITHUB_WORKSPACE/fire-blaster:/fire-blaster" \
            -e FIRE_BLASTER_SRC=/fire-blaster \
            -w /src alarm:build scripts/ci/build-pi.sh

      - name: Disk after build
        if: always()
        run: df -h /

      # Package file names carry the epoch (mpv-rpi-1:...), and artifact
      # paths can't contain a colon: ship the repo as one tarball.
      - name: Pack repo
        run: tar -C couchbox/out -cf couchbox-aarch64-repo.tar repo

      - uses: actions/upload-artifact@v4
        with:
          name: couchbox-rpi-test-image
          path: couchbox/out/couchbox-rpi-test.img.xz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: couchbox-aarch64-repo
          path: couchbox-aarch64-repo.tar
          if-no-files-found: error
          retention-days: 14
