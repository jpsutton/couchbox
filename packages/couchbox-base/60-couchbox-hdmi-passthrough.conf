# Let apps pass AC-3 (Dolby Digital) through HDMI to the TV undecoded, as
# LibreELEC and TV streamers do. Decoded and downmixed to stereo on the PC
# instead, 5.1 audio plays several dB quieter on TV speakers.
#
# This only advertises the format on the HDMI sink; nothing changes until an
# app turns passthrough on (Plezy: Audio Passthrough; Kodi: Allow passthrough,
# Dolby Digital (AC3) capable receiver). AC-3 only: nearly every HDMI TV
# decodes it, while E-AC-3, DTS and TrueHD support varies, and a codec the TV
# can't decode would play as silence. Check what yours takes with
#   grep -h coding_type /proc/asound/card*/eld*
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*hdmi*" }
    ]
    actions = {
      update-props = {
        iec958.codecs = [ "PCM" "AC3" ]
      }
    }
  }
]
