# Boot straight into the Bigscreen session as the appliance user.
# Relogin restarts the session if it exits or crashes.
[Autologin]
User=htpc
Session=plasma-bigscreen-wayland
Relogin=true

# If the greeter ever shows (autologin failed), run it on Wayland too,
# so no X server is needed.
[General]
DisplayServer=wayland
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell

[Wayland]
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1
