# couchbox may be on wired and Wi-Fi at once, both in the same subnet. By
# default Linux answers ARP for any of its addresses on any interface, so the
# router can learn the wrong MAC for an address ("ARP flux") and traffic to it,
# ZeroTier included, stops. Answer only for addresses on the interface asked,
# and announce with the sending interface's own address.
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
net.ipv4.conf.default.arp_ignore = 1
net.ipv4.conf.default.arp_announce = 2
