# Arm the hardware watchdog (sp5100_tco on the AMD boxes, iTCO on Intel) so a
# hard hang resets the box instead of waiting for someone to pull the plug.
# systemd feeds the timer every half period; if the kernel or PID 1 stops, the
# hardware resets after 30 s. RebootWatchdogSec covers a stuck shutdown.
[Manager]
RuntimeWatchdogSec=30
RebootWatchdogSec=2min
