# Make HDMI (and DisplayPort) audio the default output whenever it exists.
# WirePlumber ranks analog outputs above HDMI by default (priority.session
# about 1000 vs 600), so a fresh box would play to its headphone jack instead
# of the TV. A default the user picks later is saved and still wins: priority
# only decides when there is no saved choice, or when the saved one is gone.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*hdmi*" }
    ]
    actions = {
      update-props = {
        priority.session = 2000
      }
    }
  }
]
