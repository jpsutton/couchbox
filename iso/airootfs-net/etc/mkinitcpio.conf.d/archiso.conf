# releng's hooks, cut to what finds and mounts the boot medium. Gone: kms (GPU
# drivers load later from the live root), memdisk and the PXE hooks (couchbox
# boots from USB or a VM's CD drive; archiso_pxe_common alone pulls in every
# network driver), archiso_loop_mnt (booting an ISO file kept on another
# filesystem), and block and filesystems, which add every storage driver and
# filesystem the kernel has. MODULES lists the ones the medium can sit on;
# their dependencies come along. ? marks a module mkinitcpio may not find.
MODULES=(
  usb_storage? uas? sd_mod?
  ahci? ata_piix? nvme? mmc_block? sdhci_pci? sdhci_acpi? rtsx_pci_sdmmc? rtsx_usb_sdmmc?
  sr_mod? isofs? squashfs?
  virtio_pci? virtio_blk? virtio_scsi?
)
HOOKS=(base udev microcode modconf archiso keyboard)
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)
