# NoExtract rules for the netinstall ISO's live system, added to the archiso
# profile's pacman.conf by build-iso.sh. The last matching rule wins, so each
# block skips a whole tree and then lets back in what the installer needs.
#
# Firmware: only Wi-Fi chips and Realtek Ethernet (r8169, r8152), plus the
# Wi-Fi regulatory database. Inside those, skip chips found only in access
# points and routers (IPQ, QCN, MT798x, MT7996) or on ARM SoCs (WCN3990,
# WCN6750, MT81xx), and the Bluetooth firmware.
NoExtract = usr/lib/firmware/*
NoExtract = !usr/lib/firmware/regulatory.db* !usr/lib/firmware/iwlwifi-*
NoExtract = !usr/lib/firmware/intel/ !usr/lib/firmware/intel/iwlwifi/ !usr/lib/firmware/intel/iwlwifi/*
NoExtract = !usr/lib/firmware/ath9k_htc/* !usr/lib/firmware/ath10k/* !usr/lib/firmware/ath11k/* !usr/lib/firmware/ath12k/* !usr/lib/firmware/ar5523.bin*
NoExtract = usr/lib/firmware/ath10k/QCA4019/* usr/lib/firmware/ath10k/QCA9888/* usr/lib/firmware/ath10k/QCA9984/* usr/lib/firmware/ath10k/QCA99X0/* usr/lib/firmware/ath10k/WCN3990/*
NoExtract = usr/lib/firmware/ath11k/IPQ* usr/lib/firmware/ath11k/QCN* usr/lib/firmware/ath11k/WCN6750/*
NoExtract = usr/lib/firmware/ath12k/IPQ* usr/lib/firmware/ath12k/QCN*
NoExtract = !usr/lib/firmware/brcm/* !usr/lib/firmware/cypress/*
NoExtract = !usr/lib/firmware/mediatek/*
NoExtract = usr/lib/firmware/mediatek/mt7996/* usr/lib/firmware/mediatek/mt798* usr/lib/firmware/mediatek/mt8* usr/lib/firmware/mediatek/mt7622* usr/lib/firmware/mediatek/BT_* usr/lib/firmware/mediatek/sof/*
NoExtract = !usr/lib/firmware/rtlwifi/* !usr/lib/firmware/rtw88/* !usr/lib/firmware/rtw89/* !usr/lib/firmware/rtl_nic/*
# Documentation and translations: the installer is English only.
NoExtract = usr/share/doc/* usr/share/man/* usr/share/info/* usr/share/locale/* usr/share/gtk-doc/*
NoExtract = !usr/share/locale/locale.alias
# Nothing in the live system compiles. Kernel modules all stay: sound, media
# and RDMA modules look unneeded, but GPU, HID and NVMe-oF drivers depend on them.
NoExtract = usr/include/* usr/lib/*.a usr/share/gir-1.0/*
